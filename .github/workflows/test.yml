name: Test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: test-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ startsWith(matrix.os, 'macos-') && 'macOS' || startsWith(matrix.os, 'windows-') && 'Windows' || 'Linux' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install hatch
        run: pip install hatch

      - name: Lint and format check
        run: hatch run fmt-check

      - name: Type check
        run: hatch run test:types

      - name: Unit tests
        run: hatch run test:unit

      - name: Check secrets are available
        env:
          UPSTASH_VECTOR_REST_URL: ${{ secrets.UPSTASH_VECTOR_REST_URL }}
          UPSTASH_VECTOR_REST_TOKEN: ${{ secrets.UPSTASH_VECTOR_REST_TOKEN }}
        run: |
          echo "URL set: $([ -n "$UPSTASH_VECTOR_REST_URL" ] && echo 'yes' || echo 'no')"
          echo "TOKEN set: $([ -n "$UPSTASH_VECTOR_REST_TOKEN" ] && echo 'yes' || echo 'no')"
          echo "URL length: ${#UPSTASH_VECTOR_REST_URL}"
          echo "TOKEN length: ${#UPSTASH_VECTOR_REST_TOKEN}"

      - name: Integration tests
        env:
          UPSTASH_VECTOR_REST_URL: ${{ secrets.UPSTASH_VECTOR_REST_URL }}
          UPSTASH_VECTOR_REST_TOKEN: ${{ secrets.UPSTASH_VECTOR_REST_TOKEN }}
        run: hatch run test:integration
